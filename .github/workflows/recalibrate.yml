name: Recalibration mensuelle

on:
  schedule:
    - cron: "0 5 1 * *"  # 1er de chaque mois à 5h UTC
  workflow_dispatch:  # permet aussi un déclenchement manuel depuis GitHub

permissions:
  contents: write

jobs:
  recalibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run recalibration
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: python3 recalibrate.py

      - name: Check prediction results
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: python3 check_results.py

      - name: Commit updated settings and results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add league_settings.json predictions_log.csv
          git diff --staged --quiet || git commit -m "Recalibration + vérification des résultats mensuelle"
          git push
